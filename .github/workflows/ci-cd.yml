name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Current Commit (Push)
        run: npx commitlint --last --verbose

  build_and_test:
    name: Build & Validate Application
    runs-on: ubuntu-latest
    needs: commitlint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Biome Check & Lint
        run: npm run ci:check

      - name: Security Audit (npm audit)
        run: npm run audit

      - name: Run Type Checking
        run: npm run type-check

      - name: Setup Next.js Cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Compile and Build Assets
        run: npm run build

      - name: Generate Build Info
        run: |
          echo "{\"timestamp\":\"$(date -u -Iseconds)\",\"commit\":\"${{ github.sha }}\"}" > out/build-info.json

      - name: Upload Compiled Static Assets
        uses: actions/upload-artifact@v6
        with:
          name: build-assets
          path: out
          retention-days: 1

  release:
    name: Run Semantic Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Git Tags and Notes
        run: |
          git fetch --tags --force
          git fetch origin refs/notes/semantic-release:refs/notes/semantic-release || true

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  deploy:
    name: Deploy to Firebase Hosting
    environment: ${{ github.ref == 'refs/heads/develop' && 'beta' || 'prod' }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: [build_and_test, release]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Download Compiled Static Assets
        uses: actions/download-artifact@v6
        with:
          name: build-assets
          path: out

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx firebase-tools deploy --only hosting --project c-robinaud --non-interactive 2>&1 | tee deploy.log || {
            if grep -q "is the current active version" deploy.log; then
              echo "Firebase Hosting deployment succeeded (already active version, no changes to release)."
              exit 0
            else
              exit 1
            fi
          }
